services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calorie_ai}
      POSTGRES_USER: ${POSTGRES_USER:-calorie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calorie}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/calorie_ai
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-calorie}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-calorie}
    depends_on:
      - db

volumes:
  postgres_data:
